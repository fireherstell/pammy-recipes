<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chef Pammy's Food Recipe Solver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #faf7f2;
      color: #1f2937;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="pb-36 min-h-screen">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 glass border-b border-orange-100 px-4 py-3 shadow-xs">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-orange-500 rounded-2xl flex items-center justify-center text-white text-xl shadow-md shadow-orange-500/20">
          👩‍🍳
        </div>
        <div>
          <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-gray-900 leading-tight">CHEF PAMMY'S RECIPES</h1>
          <p class="text-[11px] text-gray-500">Cook with your pantry • Powered by Gemini AI</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="toggleSettingsModal(true)" class="flex items-center space-x-1 px-3 py-1.5 border border-gray-200 rounded-xl text-xs font-semibold bg-white hover:bg-orange-50 text-gray-700 shadow-sm transition-all active:scale-95">
          <span>⚙️</span>
          <span class="hidden sm:inline">Settings</span>
        </button>
        <button onclick="openSavedRecipesModal()" class="flex items-center space-x-1 px-3 py-1.5 border border-gray-200 rounded-xl text-xs font-semibold bg-white hover:bg-orange-50 text-gray-700 shadow-sm transition-all active:scale-95">
          <span>📖</span>
          <span class="hidden sm:inline">Saved</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 pt-5 space-y-5">

    <!-- SEARCH & CONTROLS -->
    <div class="space-y-3">
      <div class="relative">
        <input id="searchInput" type="text" oninput="handleSearch()" placeholder="Search from 550+ items (e.g. Aloo, Paneer, Besan, Jeera, Milk)..." 
               class="w-full pl-11 pr-24 py-3 bg-white border border-orange-100 rounded-2xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all" />
        <span class="absolute left-4 top-3.5 text-gray-400 text-base">🔍</span>
        <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-3 top-2.5 px-2.5 py-1 text-xs text-gray-400 hover:text-gray-700 font-medium">Clear</button>
      </div>

      <!-- Quick Suggested Combos -->
      <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1 text-xs">
        <span class="text-gray-400 font-semibold uppercase text-[10px] tracking-wider shrink-0">Quick Add:</span>
        <button onclick="applyQuickFilter(['Potato', 'Cumin Seeds'])" class="shrink-0 bg-white border border-amber-200/80 text-amber-900 px-3 py-1.5 rounded-full hover:bg-amber-50 shadow-2xs font-medium">🥔 Aloo + Jeera</button>
        <button onclick="applyQuickFilter(['Paneer', 'Tomato'])" class="shrink-0 bg-white border border-amber-200/80 text-amber-900 px-3 py-1.5 rounded-full hover:bg-amber-50 shadow-2xs font-medium">🧀 Paneer + Tamatar</button>
        <button onclick="applyQuickFilter(['Spinach', 'Paneer'])" class="shrink-0 bg-white border border-amber-200/80 text-amber-900 px-3 py-1.5 rounded-full hover:bg-amber-50 shadow-2xs font-medium">🥬 Palak Paneer</button>
        <button onclick="applyQuickFilter(['Curd', 'Rice Regular'])" class="shrink-0 bg-white border border-amber-200/80 text-amber-900 px-3 py-1.5 rounded-full hover:bg-amber-50 shadow-2xs font-medium">🍚 Curd Rice</button>
        <button onclick="applyQuickFilter(['Gram Flour', 'Onion'])" class="shrink-0 bg-white border border-amber-200/80 text-amber-900 px-3 py-1.5 rounded-full hover:bg-amber-50 shadow-2xs font-medium">🧅 Onion Pakora</button>
      </div>
    </div>

    <!-- CATEGORY TABS -->
    <div class="sticky top-[61px] z-30 bg-[#faf7f2]/95 backdrop-blur-md py-2 border-b border-orange-100/60">
      <div id="categoryTabs" class="flex items-center space-x-2 overflow-x-auto no-scrollbar">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- INGREDIENT LIST STATS -->
    <div class="flex items-center justify-between text-xs text-gray-500 px-1">
      <span id="filteredResultsLabel">Showing all items</span>
      <button onclick="clearAllSelections()" class="text-orange-600 hover:text-orange-700 font-medium">Reset Kitchen Selection</button>
    </div>

    <!-- INGREDIENT CARDS GRID -->
    <div id="ingredientsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
      <!-- Rendered via JS -->
    </div>

  </main>

  <!-- BOTTOM FLOATING ACTION BAR -->
  <div class="fixed bottom-0 left-0 right-0 p-4 glass border-t border-orange-100 z-30 flex justify-center">
    <button id="askChefBtn" onclick="askChefPammy()" class="w-full max-w-lg bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-orange-500/25 flex items-center justify-center space-x-2 transition-all">
      <span class="text-lg">✨</span>
      <span>Ask Chef Pammy (<span id="selectedCount" class="font-extrabold text-amber-200">0</span> items)</span>
    </button>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-5 shadow-2xl max-h-[92vh] overflow-y-auto border border-gray-100">
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">⚙️</span>
          <h2 class="text-lg font-bold text-gray-900">App Settings</h2>
        </div>
        <button onclick="toggleSettingsModal(false)" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold">✕</button>
      </div>

      <!-- Gemini API Key Setup -->
      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700">Google Gemini API Key (Stored Locally)</label>
        <input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="w-full border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none" />
        <p class="text-[11px] text-gray-500 leading-normal">
          Get a free key instantly from <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-orange-600 underline font-semibold">Google AI Studio</a>. Stored purely inside your browser localStorage.
        </p>
      </div>

      <!-- Unit Preference -->
      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700">Recipe Units</label>
        <div class="grid grid-cols-2 gap-2">
          <button id="unitMetric" onclick="setMeasurementUnit('metric')" class="py-2.5 text-xs font-bold rounded-xl border border-orange-500 bg-orange-50 text-orange-700 transition-all">Metric (g / ml)</button>
          <button id="unitCups" onclick="setMeasurementUnit('cups')" class="py-2.5 text-xs font-medium rounded-xl border border-gray-200 bg-white text-gray-600 transition-all">Cups & Spoons</button>
        </div>
      </div>

      <!-- Dietary Preference -->
      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700">Dietary Filter</label>
        <select id="dietaryFilterSelect" class="w-full border border-gray-200 rounded-xl px-3.5 py-2.5 text-xs font-medium outline-none">
          <option value="vegetarian">Pure Vegetarian (Eggs Optional)</option>
          <option value="jain">Jain (No Root Veg, No Onion/Garlic)</option>
          <option value="vegan">Strict Vegan (No Dairy, No Honey)</option>
          <option value="any">Standard Home Style</option>
        </select>
      </div>

      <!-- Pantry Staples -->
      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700">Default Kitchen Staples (Assumed Present)</label>
        <div id="staplesList" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1"></div>
        <div class="flex space-x-2 pt-1">
          <input id="newStapleInput" type="text" placeholder="Add staple (e.g. Kasuri Methi)" class="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-xs outline-none" />
          <button onclick="addStaple()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Add</button>
        </div>
      </div>

      <div class="pt-3 border-t flex justify-end">
        <button onclick="saveSettings()" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow-md">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- SAVED RECIPES MODAL -->
  <div id="savedRecipesModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto border border-gray-100">
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">📖</span>
          <h2 class="text-lg font-bold text-gray-900">Your CookBook</h2>
        </div>
        <button onclick="closeSavedRecipesModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="savedRecipesContainer" class="space-y-4"></div>
    </div>
  </div>

  <!-- AI RESPONSE MODAL -->
  <div id="recipeResultModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 shadow-2xl max-h-[92vh] flex flex-col border border-gray-100">
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">👩‍🍳</span>
          <h2 class="text-lg font-bold text-gray-900">Chef Pammy's Recommendations</h2>
        </div>
        <button onclick="toggleRecipeModal(false)" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="recipeOutput" class="space-y-4 text-sm leading-relaxed overflow-y-auto pr-1 flex-1"></div>
    </div>
  </div>

    };

    function getItemEmoji(name, cat) {
      for (const [key, icon] of Object.entries(ITEM_EMOJIS)) {
        if (name.toLowerCase().includes(key.toLowerCase())) return icon;
      }
      return CATEGORY_EMOJIS[cat] || "🍲";
    }

    // Parse RAW data to objects
    const MASTER_INGREDIENTS = RAW_MASTER_DATA.split("\n")
      .filter(line => line.trim().length > 0 && line.includes("|"))
      .map((line, idx) => {
        const parts = line.split("|").map(p => p.trim());
        const cat = parts[0];
        const eng = parts[1];
        const hin = parts[2];
        const pack = parts[3];
        const stepRaw = parts[4] || "100 g";
        
        // Parse step number & unit
        const stepMatch = stepRaw.match(/^(\d+)\s*(.*)$/);
        const stepVal = stepMatch ? parseInt(stepMatch[1], 10) : 50;
        const unitVal = stepMatch && stepMatch[2] ? stepMatch[2].trim() : "g";

        return {
          id: idx + 1,
          category: cat,
          name: eng,
          hindi: hin,
          pack: pack,
          step: stepVal,
          unit: unitVal,
          emoji: getItemEmoji(eng, cat),
          aliases: [eng.toLowerCase(), hin.toLowerCase()]
        };

        dietaryPreference = storedDiet;
        const dietSelect = document.getElementById("dietaryFilterSelect");
        if (dietSelect) dietSelect.value = storedDiet;
      }

      renderStaples();
    }

    function toggleSettingsModal(show) {
      const modal = document.getElementById("settingsModal");
      if (modal) modal.classList.toggle("hidden", !show);
    }

    function saveSettings() {
      const apiKeyInput = document.getElementById("apiKeyInput");
      const key = apiKeyInput ? apiKeyInput.value.trim() : "";
      const dietSelect = document.getElementById("dietaryFilterSelect");
      if (dietSelect) dietaryPreference = dietSelect.value;

      localStorage.setItem("pammy_gemini_key", key);
      localStorage.setItem("pammy_staples", JSON.stringify(pantryStaples));
      localStorage.setItem("pammy_unit", measurementUnit);
      localStorage.setItem("pammy_diet", dietaryPreference);
      toggleSettingsModal(false);
      alert("Settings and Gemini API Key saved!");
    }

    function setMeasurementUnit(unit, save = true) {
      measurementUnit = unit;
      const unitMetric = document.getElementById("unitMetric");
      const unitCups = document.getElementById("unitCups");
      
      if (unitMetric) {
        unitMetric.className = unit === 'metric' 
          ? "py-2.5 text-xs font-bold rounded-xl border border-orange-500 bg-orange-50 text-orange-700 transition-all"
          : "py-2.5 text-xs font-medium rounded-xl border border-gray-200 bg-white text-gray-600 transition-all";
      }
      if (unitCups) {
        unitCups.className = unit === 'cups' 
          ? "py-2.5 text-xs font-bold rounded-xl border border-orange-500 bg-orange-50 text-orange-700 transition-all"
          : "py-2.5 text-xs font-medium rounded-xl border border-gray-200 bg-white text-gray-600 transition-all";
      }
      if (save) localStorage.setItem("pammy_unit", measurementUnit);
    }

    function renderStaples() {
      const container = document.getElementById("staplesList");
      if (!container) return;
      container.innerHTML = pantryStaples.map((staple, index) => `
        <span class="inline-flex items-center space-x-1.5 bg-orange-50/80 text-orange-900 text-[11px] px-2.5 py-1 rounded-full border border-orange-200/80">
          <span>${staple}</span>
          <button onclick="removeStaple(${index})" class="text-orange-400 hover:text-orange-700 font-bold">✕</button>
        </span>
      `).join("");
    }

    function addStaple() {
      const input = document.getElementById("newStapleInput");
      if (!input) return;
      const value = input.value.trim();
      if (value && !pantryStaples.includes(value)) {
        pantryStaples.push(value);
        input.value = "";
        renderStaples();
      }
    }

    function removeStaple(index) {
      pantryStaples.splice(index, 1);
      renderStaples();
    }

    function renderCategoryTabs() {
      const categories = ["ALL", ...new Set(MASTER_INGREDIENTS.map(i => i.category))];
      const tabsContainer = document.getElementById("categoryTabs");
      if (!tabsContainer) return;
      tabsContainer.innerHTML = categories.map(cat => {
        const isSelected = currentCategory === cat;
        const icon = CATEGORY_EMOJIS[cat] || (cat === "ALL" ? "✨" : "🍽️");
        return `
          <button onclick="selectCategory('${cat}')" class="shrink-0 flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-2xs ${
            isSelected 
              ? 'bg-orange-500 text-white shadow-md shadow-orange-500/20' 
              : 'bg-white text-gray-600 border border-gray-200/70 hover:bg-orange-50'
          }">
            <span>${icon}</span>
            <span>${cat}</span>
          </button>
        `;
      }).join("");
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryTabs();
      renderIngredients();
    }

    function handleSearch() {
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      searchQuery = input ? input.value.toLowerCase().trim() : "";
      if (clearBtn) clearBtn.classList.toggle("hidden", searchQuery.length === 0);
      renderIngredients();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      if (input) input.value = "";
      handleSearch();
    }

    function applyQuickFilter(itemNames) {
      itemNames.forEach(name => {
        const found = MASTER_INGREDIENTS.find(i => i.name.toLowerCase().includes(name.toLowerCase()));
        if (found) {
          selectedIngredients[found.name] = (selectedIngredients[found.name] || 0) + found.step;
        }
      });
      renderIngredients();
      updateSelectedCount();
    }

    function clearAllSelections() {
      if (Object.keys(selectedIngredients).length === 0) return;
      if (confirm("Reset all chosen kitchen ingredients?")) {
        selectedIngredients = {};
        renderIngredients();
        updateSelectedCount();
      }
    }

    function renderIngredients() {
      const grid = document.getElementById("ingredientsGrid");
      const label = document.getElementById("filteredResultsLabel");
      if (!grid) return;

      const filtered = MASTER_INGREDIENTS.filter(item => {
        const matchesCategory = currentCategory === "ALL" || item.category === currentCategory;
        const matchesSearch = !searchQuery || 
                              item.name.toLowerCase().includes(searchQuery) || 
                              item.hindi.toLowerCase().includes(searchQuery) ||
                              item.aliases.some(a => a.includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (label) {
        label.innerText = `Showing ${filtered.length} of ${MASTER_INGREDIENTS.length} items${currentCategory !== 'ALL' ? `in ${currentCategory}` : ''}`;
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-gray-400 space-y-2">
            <span class="text-4xl">🔍</span>
            <p class="text-sm font-medium">No ingredients found for "${searchQuery}"</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const qty = selectedIngredients[item.name] || 0;
        const inKitchen = qty > 0;

        return `
          <div class="bg-white rounded-2xl p-3.5 border transition-all duration-200 flex flex-col justify-between shadow-2xs hover:shadow-md ${
            inKitchen 
              ? 'border-emerald-500/70 bg-gradient-to-b from-emerald-50/40 to-white ring-1 ring-emerald-500/30' 
              : 'border-orange-100/80 hover:border-orange-200'
          }">
            <div class="flex justify-between items-start gap-1 mb-2">
              <div class="w-10 h-10 rounded-xl bg-orange-50/80 border border-orange-100 flex items-center justify-center text-2xl shadow-2xs">
                ${item.emoji}
              </div>
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${
                inKitchen ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-500'
              }">
                ${inKitchen ? `${qty} ${item.unit}` : 'Not in kitchen'}
              </span>
            </div>

            <div class="mb-3">
              <h3 class="font-bold text-gray-900 text-sm leading-tight line-clamp-1">${item.hindi}</h3>
              <p class="text-xs text-gray-600 font-medium">${item.name}</p>
              <p class="text-[10px] text-gray-400 mt-1">Pack: ${item.pack}</p>
            </div>

            <div>
              <div class="flex items-center justify-between bg-gray-50/80 rounded-xl p-1 border border-gray-100">
                <button onclick="updateQty('${item.name}', -${item.step})" class="w-8 h-8 rounded-lg bg-white hover:bg-gray-100 border border-gray-200 active:scale-90 flex items-center justify-center font-extrabold text-gray-700 text-base shadow-2xs transition-all">-</button>
                <span class="text-xs font-bold ${inKitchen ? 'text-emerald-700' : 'text-gray-400'}">${qty} <span class="text-[10px] font-normal">${item.unit}</span></span>
                <button onclick="updateQty('${item.name}',${item.step})" class="w-8 h-8 rounded-lg bg-orange-500 hover:bg-orange-600 text-white active:scale-90 flex items-center justify-center font-extrabold text-base shadow-2xs transition-all">+</button>
              </div>
              <div class="text-[9px] text-center text-gray-400 mt-1">Step: ±${item.step}${item.unit}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function updateQty(name, delta) {
      const item = MASTER_INGREDIENTS.find(i => i.name === name);
      if (!item) return;

      const currentQty = selectedIngredients[name] || 0;
      const newQty = Math.max(0, currentQty + delta);

      if (newQty === 0) {
        delete selectedIngredients[name];
      } else {
        selectedIngredients[name] = newQty;
      }

      renderIngredients();
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const count = Object.keys(selectedIngredients).length;
      const countEl = document.getElementById("selectedCount");
      if (countEl) countEl.innerText = count;
    }

    // CALL GOOGLE GEMINI API
    async function askChefPammy() {
      if (isGenerating) return;

      const key = localStorage.getItem("pammy_gemini_key");
      if (!key) {
        alert("Please configure your Google Gemini API key under Settings first!");
        toggleSettingsModal(true);
        return;
      }

      const availableItems = Object.entries(selectedIngredients).map(([name, qty]) => {
        const item = MASTER_INGREDIENTS.find(i => i.name === name);
        return `${item.hindi} (${name}): ${qty}${item.unit}`;
      });

      if (availableItems.length === 0) {
        alert("Please add at least 1 ingredient present in your kitchen!");
        return;
      }

      const modal = document.getElementById("recipeResultModal");
      const output = document.getElementById("recipeOutput");
      const askBtn = document.getElementById("askChefBtn");

      if (modal) modal.classList.remove("hidden");
      if (output) {
        output.innerHTML = `
          <div class="p-10 text-center space-y-3">
            <div class="inline-block animate-spin text-4xl">🍳</div>
            <p class="font-bold text-gray-800 text-base">Chef Pammy is checking your kitchen ingredients...</p>
            <p class="text-xs text-gray-500">Creating authentic recipes matched to your measurement units and staples.</p>
          </div>
        `;
      }

      const promptText = `

${availableItems.join(", ")}

Default Pantry Staples assumed already available in kitchen:
${pantryStaples.join(", ")}

Preferences:
- Dietary rule: ${dietaryPreference}
- Measurement Units: ${measurementUnit}

Please suggest 2 to 3 creative, practical, and authentic dishes that can be made using primarily what is available.
Format clearly using clean Markdown with:
## Recipe Name
**Time:** prep & cook time
**Kitchen Ingredients Used:** bullet points with quantities
**Pantry Staples Used:**
**Step-by-step Cooking Method:** numbered steps
**Chef Pammy's Secret Tip:** 1 practical tip
`;

      try {
        isGenerating = true;
        askBtn.disabled = true;
        askBtn.classList.add("opacity-50", "cursor-not-allowed");

        // Use official Gemini REST API v1beta
        const modelEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
        
        const response = await fetch(modelEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              temperature: 0.7,
              maxOutputTokens: 2048
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "Failed to communicate with Gemini API");
        }

        const candidate = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!candidate) throw new Error("No response generated by the model.");

        currentGeneratedRecipe = candidate;

        if (output) {
          output.innerHTML = `
            <div class="prose max-w-none text-gray-800 space-y-3 text-xs sm:text-sm">
              ${formatMarkdown(currentGeneratedRecipe)}
            </div>
            <div class="pt-4 border-t flex justify-end">
              <button onclick="saveCurrentRecipe()" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md transition-all">
                💾 Save to CookBook
              </button>
            </div>
          `;
        }
      } catch (err) {
        if (output) {
          output.innerHTML = `
            <div class="p-6 bg-red-50 border border-red-200 rounded-2xl text-red-700 text-xs space-y-2">
              <p class="font-bold text-sm">Error generating recipes:</p>
              <p>${err.message}</p>
              <p class="text-gray-500 pt-
